git_flow_for_github:
  label: git-flow for GitHub
  resources:
    - id: create_release_pr
      path: .github/workflows/create_release_pr.yaml
      post_message: You have to add the secret variable GH_TOKEN to your repository settings
    - id: merge_release_into_develop
      path: .github/workflows/merge_release_into_develop.yaml
      post_message: You have to add the secret variable GH_TOKEN to your repository settings
    - id: publish_release
      path: .github/workflows/publish_release.yaml
      post_message: You have to add the secret variable GH_TOKEN to your repository settings
    - id: rebase
      path: .github/workflows/rebase.yaml
      post_message: You have to add the secret variable GH_TOKEN to your repository settings
changelog_generator:
  label: changelog generator
  resources:
    - id: changie
      path: .changie.yaml
      post_message: You may need to update replacement config to make sure the version will be updated by changie.
    - id: chglog_config
      path: .chglog/config.yml
      post_message: You have to update the variable `repository_url`.
    - id: changelog_template
      path: .chglog/CHANGELOG.tpl.md
    - id: changelog_header_template
      path: .chglog/CHANGELOG_HEADER.tpl.md
    - id: unreleased_gitkeep
      path: .changes/unreleased/.gitkeep
editorconfig:
  label: .editorconfig
  resources:
    - id: editorconfig
      path: .editorconfig
renovate_json:
  label: renovate.json
  resources:
    - id: renovate_json
      path: renovate.json
      post_message: You may need to update the base branch.
mit_license:
  label: MIT LICENSE
  resources:
    - id: mit_license
      path: MIT_LICENSE
      target: LICENSE
      post_message: You need to update the variables `current_year` and `author_name`.
github_funding:
  label: GitHub Funding
  resources:
    - id: github_funding
      path: .github/FUNDING.yml
